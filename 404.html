<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Testing T-Shirt</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --black:#111111;
    --gray-500:#737373;
    --gray-300:#d4d4d4;
    --gray-100:#f5f5f5;
    --white:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,'Inter',Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--white);color:var(--black);text-align:center;padding:24px;
  }
  .logo{margin-bottom:36px;}
  .logo img{height:30px;object-fit:contain;}
  .logo .fallback{display:none;font-weight:800;font-size:18px;letter-spacing:-.4px;}
  .code{font-size:96px;font-weight:800;letter-spacing:-4px;line-height:1;margin-bottom:8px;}
  .title{font-size:20px;font-weight:700;margin-bottom:10px;}
  .sub{color:var(--gray-500);font-size:14px;max-width:340px;margin-bottom:32px;line-height:1.6;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 24px;border-radius:12px;font-weight:600;font-size:14px;text-decoration:none;
    transition:all .15s;
  }
  .btn-primary{background:var(--black);color:#fff;}
  .btn-primary:hover{background:#1a1a1a;}
  .btn-outline{background:#fff;color:var(--black);border:1.5px solid var(--gray-300);}
  .btn-outline:hover{border-color:var(--black);}
  .tshirt-icon{width:64px;height:64px;color:var(--gray-300);margin-bottom:20px;}
</style>
</head>
<body>
  <div class="logo">
    <img src="logo.png" alt="Testing T-Shirt" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <div class="fallback">TESTING T-SHIRT</div>
  </div>

  <svg class="tshirt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M16 3l3 3-2.5 2.5L14 6l-2 2-2-2-2.5 2.5L5 6l3-3 2-1h4l2 1z"/>
    <path d="M7 8v13h10V8"/>
  </svg>

  <div class="code">404</div>
  <div class="title">This page doesn't exist</div>
  <div class="sub">The page you're looking for may have been moved, renamed, or never existed. Let's get you back on track.</div>

  <div class="actions">
    <a href="user.html" class="btn btn-primary">Back to Home</a>
    <a href="user.html" class="btn btn-outline" onclick="window.history.back();return false;">Go Back</a>
  </div>
</body>
</html>
